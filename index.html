<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Almacén 1811</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --surface:#ffffff; --surface-2:#f8fafc; --ink:#111827; --muted:#64748b; --line:#e2e8f0; --line-strong:#cbd5e1;
  --accent:#68a614; --accent-soft:#4d7c0f; --accent-ink:#ffffff; --btn:#68a614; --btn-ink:#ffffff;
  --s-ingreso:#2563eb; --s-consumo:#ea580c; --s-traspaso:#059669;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626; --violet:#7c3aed; --cell-edge:rgba(15,23,42,.22); --occ:#3b82f6;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
.mono{font-family:var(--mono)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.03)}
.lt{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.btn-toggle{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:8px;padding:7px 10px;display:inline-flex;align-items:center;justify-content:center}
.btn-toggle:hover{background:#eef2f6}
.logo-box{display:inline-flex;align-items:center;justify-content:center;background:transparent;padding:2px 4px;height:40px;flex:none}
.logo-box img{max-height:34px;width:auto;display:block;object-fit:contain}
.ttl h1{font-size:17px;font-weight:700;margin:0;color:var(--ink)}
.ttl h1 .sep{color:var(--line-strong);font-weight:300;margin:0 4px}
.ttl h1 .alm{color:var(--muted);font-weight:500}
.ttl h1 .avail{color:var(--good);font-weight:600}
.ttl p{margin:0;color:var(--muted);font-size:12.5px}
.rt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill-st{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--ink);max-width:100%}
.pill-st i{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.pill-st.ok i{background:var(--good)}
.pill-st.sync i{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.avatar{width:34px;height:34px;border-radius:50%;background:#111827;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;border:2px solid var(--accent)}

.shell{display:grid;grid-template-columns:205px minmax(0,1fr);align-items:start;transition:grid-template-columns .2s ease}
.shell.collapsed{grid-template-columns:0px minmax(0,1fr)}
.shell.collapsed .side{display:none}
.side{position:sticky;top:0;align-self:stretch;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:5px;min-height:calc(100vh - 68px);overflow:hidden}
.side nav{display:flex;flex-direction:column;gap:5px}
.side nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:11px 10px;color:var(--muted);font-weight:500;font-size:13.5px;text-align:left;line-height:1.25;transition:background .15s,color .15s}
.side nav button svg{width:18px;height:18px;flex:none}
.side nav button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.side nav button[aria-selected="true"]{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(104,166,20,.28)}
.side nav button:disabled{opacity:.4;cursor:default}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
main{padding:18px 20px 40px 20px;min-width:0;zoom:0.9}

@media (max-width:860px){
  .shell,.shell.collapsed{grid-template-columns:minmax(0,1fr)}
  .shell.collapsed .side{display:flex}
  .side{position:static;min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:8px 14px}
  .side nav{flex-direction:row;overflow-x:auto;flex:1 1 100%}
  .side nav button{padding:9px 11px;font-size:13.5px;white-space:nowrap}
  .sidefoot{flex-direction:row;flex-wrap:wrap;margin:0;padding:0;flex:1 1 100%}
  main{padding:16px 14px 40px 14px}
}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600;box-shadow:0 2px 6px rgba(104,166,20,.22);transition:filter .15s}
.btn:hover{filter:brightness(0.95)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
h2{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.note{color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);padding:12px 14px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface-2)}

.hero{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;padding:24px;border-radius:16px;border:1px solid #d9e8c5;background:linear-gradient(135deg,#ffffff 0%,#f7fbef 60%,#eef6e2 100%);margin-bottom:18px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.hero .tag{display:inline-block;padding:4px 12px;border:1px solid #cbe0ae;border-radius:999px;color:var(--accent-soft);background:#f0f8e4;font-size:11.5px;font-weight:700;letter-spacing:.07em}
.hero h2{font-size:clamp(20px,3vw,27px);line-height:1.18;margin:12px 0 8px;font-weight:700;letter-spacing:-.01em;max-width:660px;text-wrap:balance;color:#111827}
.hero p{margin:0;color:#475569;max-width:580px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .acts .btn{display:inline-flex;align-items:center;gap:10px;min-width:150px;justify-content:center;padding:12px 16px}
.hero .acts svg{width:18px;height:18px}

.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kcard{display:flex;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.kcard .l{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kcard .v{font-size:30px;font-weight:700;margin:6px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.kcard .s{font-size:12.5px;font-weight:600}
.kcard .s.up{color:var(--good)}.kcard .s.wn{color:var(--warn)}.kcard .s.vi{color:var(--violet)}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.blue{background:#eff6ff;color:#2563eb}.ico.amber{background:#fffbeb;color:var(--warn)}
.ico.green{background:#f0fdf4;color:var(--good)}.ico.violet{background:#f5f3ff;color:var(--violet)}

.drop{display:grid;place-items:center;text-align:center;padding:56px 20px;border:2px dashed var(--line-strong);border-radius:18px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:#f7fbef}
.drop h2{font-size:18px}
.mini{margin-bottom:10px}
.mini .t{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:2px}
.mini .t b{font-weight:600;color:var(--ink)}
.mini svg{width:100%;height:auto;display:block}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--font);fill:var(--muted);font-size:10px}

.barrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 54px;gap:10px;align-items:center;padding:5px 4px;border:0;background:none;width:100%;text-align:left;border-radius:6px}
.barrow:hover{background:var(--surface-2)}
.barrow .nm{display:flex;align-items:center;min-width:0;font-size:13px;color:var(--ink)}
.barrow .nm span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bar{height:8px;background:#eef2f6;border-radius:4px;overflow:hidden}
.barrow .bar i{display:block;height:100%;border-radius:4px;border:1px solid var(--cell-edge)}
.barrow .n{font-family:var(--mono);text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}

.chipbox{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:12px;white-space:nowrap;color:var(--ink)}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.chip .sw{margin:0;border:1px solid var(--cell-edge)}

.tablewrap{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12px;color:#334155;cursor:pointer;user-select:none;z-index:1;border-bottom:1px solid var(--line-strong)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.desc{white-space:normal;min-width:220px;max-width:340px}
tr:hover td{background:#f8fafc}
tr.sel-row td,tr.sel-row:hover td{background:#f1f8e6}
td a,.link{color:var(--accent-soft);font-weight:600;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:6px 12px;font-weight:500;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.seg button:disabled{opacity:.45;cursor:default}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 10px 0}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 9px;min-width:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px}
.filters input[type=search]{width:min(100%,240px)}

.maplayout{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.mapscroll{
  overflow:auto;
  padding:14px 18px;
  max-height:74vh;
  background:#ffffff;
  color:#0f172a;
  border-color:var(--line-strong);
}
.aisle{margin-bottom:18px;width:max-content}
.aisle:last-child{margin-bottom:0}
.aisle h3{
  margin:0 0 6px;
  font-size:14px;
  font-weight:700;
  display:flex;
  gap:8px;
  align-items:center;
  color:#111827;
}
.aisle h3 .aisle-tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:34px;
  padding:2px 8px;
  border-radius:4px;
  background:#111827;
  color:#ffffff;
  font-family:var(--mono);
  font-size:12.5px;
  font-weight:700;
}
.aisle h3 small{font-weight:500;color:#64748b;font-size:12px}
.agrid{
  display:grid;
  grid-template-columns:repeat(var(--cols),var(--cs));
  grid-auto-rows:var(--cs);
  gap:0;
  --cs:25px;
  background:#ffffff;
}
.agrid .cn{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  color:#475569;
  text-align:center;
  line-height:16px;
  height:16px;
}
.agrid .cn.hd{grid-row:1}
.cell,
.cell.cat,
.cell.occ{
  border-top:1.5px solid #e6b84c;
  border-bottom:1.5px solid #e6b84c;
  border-left:1.5px solid #2563eb;
  border-right:1.5px solid #2563eb;
  border-radius:0;
  padding:0;
  background:#fffdf7;
  width:var(--cs);
  height:var(--cs);
  box-shadow:none;
}
.cell.occ{
  background:var(--occ);
}
.cell.top-lv,
.cell.cat.top-lv,
.cell.occ.top-lv{
  border-top:none;
}
.cell.base-lv,
.cell.cat.base-lv,
.cell.occ.base-lv{
  border-bottom:none;
}
.cell.dim{opacity:.2}
.cell.hit{
  box-shadow:inset 0 0 0 2px #111827;
  z-index:2;
  position:relative;
}
.cell.sel{
  box-shadow:inset 0 0 0 2px #111827, inset 0 0 0 4px #ffffff;
  z-index:3;
  position:relative;
}
.gap{width:var(--cs);height:var(--cs);background:#ffffff}
.agrid{position:relative}
.cell.multi{position:relative}
.cell.multi::after{
  content:"";
  position:absolute;
  top:2px;
  right:2px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#dc2626;
  border:1px solid #ffffff;
  pointer-events:none;
}
.zona-band{
  grid-column:33 / 44;
  height:var(--cs);
  background:#d0cece;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
  letter-spacing:.03em;
  white-space:nowrap;
  overflow:hidden;
}
.zona-box{
  position:absolute;
  left:calc(var(--cs) * 32);
  top:var(--cs);
  width:calc(var(--cs) * 11);
  height:calc(var(--cs) * 6);
  border:2px dashed #111827;
  box-sizing:border-box;
  pointer-events:none;
  z-index:4;
}

.detail{position:static;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.detail-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.detail-head-left{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.detail .code{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1.1;color:var(--ink)}
.coords-inline{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.coords-inline b{color:var(--ink);font-weight:600}
.detail-mat-title{margin:8px 0 6px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-soft)}
.detail dl.mat-grid{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px;font-size:12.5px}
.detail dl.mat-grid dt{color:var(--muted);font-size:11px;font-weight:500}
.detail dl.mat-grid dd{margin:1px 0 0;min-width:0;overflow-wrap:anywhere;color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor;background:#ffffff}
.pill.ok{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
#tip{position:fixed;z-index:50;pointer-events:none;background:#111827;color:#ffffff;padding:6px 10px;border-radius:6px;font-size:12px;max-width:260px;display:none;white-space:pre-line;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.err{color:var(--bad);font-weight:500}
</style>
<style id="login-style">
#loginGate{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  /* Color base OPACO: mientras la foto descarga, el panel de atrás no se transparenta */
  background-color:#0f172a;
  background:
    linear-gradient(135deg, rgba(15, 23, 42, 0.42) 0%, rgba(15, 23, 42, 0.25) 100%),
    url('https://woycturpjrgacejnmnzz.supabase.co/storage/v1/object/public/Reporte%20de%20Excel/almacen.jpeg') center center / cover no-repeat #0f172a;
  font-family:var(--font);
  color:var(--ink);
}
/* Sin sesión: el panel permanece oculto hasta iniciar sesión. Con sesión guardada: el login no se muestra ni un instante. */
html:not(.authed) .app{visibility:hidden}
html.authed #loginGate{display:none}
#loginGate[hidden]{display:none}
#loginGate .lg-card{
  width:100%;
  max-width:400px;
  background:#ffffff;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255, 255, 255, 0.75);
  border-radius:16px;
  padding:28px 26px 22px;
  box-shadow:0 20px 45px rgba(15, 23, 42, 0.32);
}
#loginGate .lg-logo{display:flex;justify-content:center;height:84px;margin-bottom:16px}
#loginGate .lg-logo img{max-height:82px;width:auto;max-width:100%;object-fit:contain}
#loginGate .lg-tag{display:block;text-align:center;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--accent-soft);margin-bottom:6px}
#loginGate h1{font-size:18px;font-weight:700;text-align:center;margin:0 0 2px}
#loginGate .lg-sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 20px}
#loginGate label{display:block;font-size:12.5px;font-weight:600;margin:0 0 5px}
#loginGate input{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:rgba(255,255,255,0.95);font-size:14px;margin-bottom:14px}
#loginGate input:focus{border-color:var(--accent);outline:2px solid rgba(104,166,20,.25);outline-offset:0}
#loginGate .btn{width:100%;padding:11px 16px}
#loginGate .lg-err{min-height:18px;color:var(--bad);font-size:12.5px;margin:-4px 0 10px;text-align:center}
#loginGate .lg-card.shake{animation:lgshake .35s}
@keyframes lgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#loginGate .lg-sync{display:flex;justify-content:center;margin-top:16px}
</style>
<link rel="preload" as="image" href="https://woycturpjrgacejnmnzz.supabase.co/storage/v1/object/public/Reporte%20de%20Excel/almacen.jpeg">
<script>
/* Se ejecuta antes de dibujar la página: si ya hay sesión guardada, se evita el destello del login */
try{if(sessionStorage.getItem('almacen1811_session'))document.documentElement.classList.add('authed')}catch(e){}
</script>
</head><body>
<div id="loginGate" role="dialog" aria-modal="true" aria-labelledby="lgTitle">
  <div class="lg-card" id="lgCard">
    <div class="lg-logo"><img id="lgLogo" alt="Chryso Saint-Gobain"></div>
    <span class="lg-tag">CENTRO DE LOGÍSTICA · CHRYSO SAINT-GOBAIN</span>
    <h1 id="lgTitle">Panel Almacén 1811</h1>
    <p class="lg-sub">Ingresa con tu DNI para continuar</p>
    <form id="lgForm" autocomplete="off">
      <label for="lgUser">Usuario</label>
      <input id="lgUser" name="usuario" type="text" inputmode="numeric" maxlength="8" placeholder="DNI" autocomplete="username">
      <label for="lgPass">Contraseña</label>
      <input id="lgPass" name="clave" type="password" inputmode="numeric" maxlength="8" placeholder="DNI" autocomplete="current-password">
      <div class="lg-err" id="lgErr" aria-live="polite"></div>
      <button class="btn" type="submit">Ingresar</button>
    </form>
    <div class="lg-sync"><div class="pill-st sync" id="lgSync"><i></i><span>Sincronizando con la nube…</span></div></div>
  </div>
</div>


<div class="app">
  <header class="top">
    <div class="lt">
      <button class="btn-toggle" id="btntoggle" title="Ocultar / Mostrar menú lateral" aria-label="Alternar menú">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
const pad2=n=>String(n).padStart(2,'0');
const nf=new Intl.NumberFormat('es-PE',{maximumFractionDigits:3});
const nf1=new Intl.NumberFormat('es-PE',{maximumFractionDigits:1});
const fmt=n=>n==null||n===''||isNaN(n)?'—':nf.format(n);
function fmtDate(iso){if(!iso)return '—';const p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function fmtShort(iso){const p=iso.split('-');return p[2]+'/'+p[1]}
function colName(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function cellV(ws,r,c){const x=ws[colName(c)+r];return x?x.v:undefined}
function toISO(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000){return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10)}
  const s=String(v).trim().replace(/\//g,'.');
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)return m[3]+'-'+pad2(m[2])+'-'+pad2(m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  return '';
}
const str=v=>v==null?'':String(v).trim();
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
function rangeOf(ws){
  const ref=ws['!ref']||'A1:A1';const m=ref.match(/([A-Z]+)(\d+):([A-Z]+)(\d+)/);if(!m)return{r2:1,c2:1};
  const cn=s=>s.split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0);
  return{r2:+m[4],c2:cn(m[3])};
}
function rowsOf(ws,maxCols){const {r2,c2}=rangeOf(ws);const C=Math.min(c2,maxCols);const out=[];
  for(let r=1;r<=r2;r++){const row=[];for(let c=1;c<=C;c++)row.push(cellV(ws,r,c));out.push(row)}return out}
function findSheet(wb,key){const n=wb.SheetNames.find(x=>norm(x).includes(key));return n?wb.Sheets[n]:null}

function parseWorkbook(wb,fileName){
  const missing=[];const data={meta:{file:fileName,at:new Date().toISOString()},mov:[],mats:{},cells:[],maxCol:43,maestro:{},maestroTotal:0};
  const defs=[
   {key:'ingreso',sheet:'ingreso',map:{doc:0,mat:1,guia:2,fecha:3,desc:4,lote:5,cant:6,um:7,venc:8,user:9},need:['mat','doc']},
   {key:'consumo',sheet:'consumo',map:{orden:0,doc:1,mat:2,fecha:3,desc:4,lote:5,cant:6,um:7,user:8},need:['mat','doc']},
   {key:'traspaso',sheet:'traspaso',map:{mat:0,alm:1,texto:2,fecha:3,desc:4,lote:5,cant:6,um:7,user:8},need:['mat']}
  ];
  defs.forEach(d=>{
    const ws=findSheet(wb,d.sheet);if(!ws){missing.push(d.sheet);return}
    const all=rowsOf(ws,14);let map=d.map;
    if(d.key==='ingreso'){
      /* INGRESO: se leen las columnas por el nombre del encabezado (incluye ORDEN DE COMPRA). Si el Excel es del formato anterior (sin esa columna) sigue funcionando. */
      const h=(all[0]||[]).map(x=>norm(x));const hasOC=h.includes('orden de compra');const s=hasOC?1:0;
      const eq=(k,fb)=>{const i=h.indexOf(k);return i>=0?i:fb};
      map={doc:eq('documento material',0),oc:hasOC?eq('orden de compra',1):-1,mat:eq('material',1+s),guia:eq('n° guia',2+s),fecha:eq('fecha',3+s),
        desc:eq('descripcion',4+s),lote:eq('lote',5+s),cant:eq('cant.',6+s),um:eq('um',7+s),venc:eq('fecha vencimiento',8+s),user:eq('user',9+s)};
    }
    all.slice(1).forEach(r=>{
      const o={t:d.key};Object.keys(map).forEach(k=>o[k]=map[k]>=0?r[map[k]]:undefined);
      if(!d.need.some(k=>str(o[k])!==''))return;
      data.mov.push({t:d.key,doc:str(o.doc),oc:str(o.oc),orden:str(o.orden),mat:str(o.mat),guia:str(o.guia),fecha:toISO(o.fecha),
        desc:str(o.desc),lote:str(o.lote),cant:num(o.cant),um:str(o.um),venc:toISO(o.venc),user:str(o.user),alm:str(o.alm),texto:str(o.texto)});
    });
  });
  const wv=findSheet(wb,'verific');
  if(wv){
    const rows=rowsOf(wv,20);const h=(rows[0]||[]).map(x=>norm(x));
    const ix=(...ks)=>{for(const k of ks){const i=h.findIndex(x=>x.includes(k));if(i>=0)return i}return -1};
    const I={mat:0,nom:ix('nombre'),umb:ix('umb'),tipo:ix('descripcion de tipo'),linea:ix('linea'),pres:ix('presentacion'),
      bultos:ix('bultos x pallet'),cpal:ix('cantidad x pallet'),env:ix('tipo de envase'),alm:ix('almacenamiento'),peso:ix('peso neto')};
    rows.slice(1).forEach(r=>{const k=str(r[0]);if(!k)return;
      data.mats[k]={nom:str(r[I.nom]),umb:str(r[I.umb]),tipo:str(r[I.tipo]),linea:str(r[I.linea]),pres:str(r[I.pres]),
        bultos:num(r[I.bultos]),cpal:num(r[I.cpal]),env:str(r[I.env]),alm:str(r[I.alm]),peso:num(r[I.peso])}});
  }else missing.push('verificación');
  const wl=findSheet(wb,'layout');
  if(wl){
    let maxCol=0;for(let c=8;c<=80;c++){if(typeof cellV(wl,1,c)==='number')maxCol=c}
    if(!maxCol)maxCol=50;data.maxCol=maxCol-7;
    const {r2}=rangeOf(wl);
    for(let r=2;r<=Math.min(r2,120);r++){
      const lab=cellV(wl,r,2);
      if(typeof lab==='string'&&/^[A-Z]$/.test(lab.trim())){
        const p='B'+lab.trim();
        for(let k=0;k<5;k++)for(let c=8;c<=maxCol;c++){
          const v=cellV(wl,r+k,c);
          if(typeof v==='string'&&v.trim()){
            const key=norm(v);const cat=CAT_BY_KEY[key]?key:(key.startsWith('ubicacion vacia')?'vacia':'otro:'+v.trim());
            data.cells.push([p+'.'+pad2(c-7)+'.'+pad2(5-k),cat==='ubicacion vacia'?'vacia':cat]);
          }
        }
      }
    }
  }else missing.push('layout');
  const wm=findSheet(wb,'maestro');
  if(wm){
    const rows=rowsOf(wm,24);const h=(rows[0]||[]).map(x=>norm(x));
    const iMat=h.findIndex(x=>x.includes('codigo de material'));
    const iLote=h.lastIndexOf('lote');
    const iVen=h.findIndex(x=>x.includes('vencimiento'));
    const iCant=20;
    const iObs=h.findIndex(x=>x==='obs');
    rows.slice(1).forEach(r=>{const loc=str(r[0]).toUpperCase();if(!loc)return;data.maestroTotal++;
      const m=iMat>=0?str(r[iMat]):'';
      if(m){
        (data.maestro[loc]||(data.maestro[loc]=[])).push({
          mat:m,
          lote:iLote>=0?str(r[iLote]):'',
          venc:iVen>=0?toISO(r[iVen]):'',
          cant:r[iCant]!=null?num(r[iCant]):0,
          obs:iObs>=0?str(r[iObs]):''
        });
      }});
  }else missing.push('maestro');
  data.missing=missing;
  return data;
}

let S=null;
let syncState='idle';
let lastSyncAt=0;
const UI={view:'resumen',tab:'consumo',f:{from:'',to:'',q:'',user:'',um:''},sort:{k:'fecha',dir:-1},limit:150,
  map:{mode:'cat',aisle:'',q:'',cats:new Set()},sel:''};
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function restore(){
  try{
    const j=localStorage.getItem(LS_KEY);
    if(j){S=JSON.parse(j);prepare();return}
  }catch(e){}
  const pre=$('#preloaded-data');
  if(pre&&pre.textContent.trim()){
    try{S=JSON.parse(pre.textContent);prepare()}catch(e){S=null}
  }
}
function prepare(){
  if(!S)return;
  S.cells=Array.isArray(S.cells)?S.cells:[];
  S.mov=Array.isArray(S.mov)?S.mov:[];
  S.mats=S.mats&&typeof S.mats==='object'?S.mats:{};
  S.maestro=S.maestro&&typeof S.maestro==='object'?S.maestro:{};
  Object.keys(S.maestro).forEach(k=>{
    const v=S.maestro[k];
    const arr=Array.isArray(v)?v:(v&&typeof v==='object'?[v]:[]);
    if(arr.length)S.maestro[k]=arr;else delete S.maestro[k];
  });
  S.invLines=Object.keys(S.maestro).reduce((a,k)=>a+S.maestro[k].length,0);
  S.meta=S.meta&&typeof S.meta==='object'?S.meta:{file:'LAYOUT v3.0.xlsm',at:new Date().toISOString()};
  S.cellMap={};S.cells.forEach(c=>{if(Array.isArray(c)&&c[0])S.cellMap[c[0]]=c[1]});
  S.hasInv=Object.keys(S.maestro).length>0;
  S.dates=[...new Set(S.mov.map(m=>m.fecha).filter(Boolean))].sort();
  S.users=[...new Set(S.mov.map(m=>m.user).filter(Boolean))].sort();
  S.mov.forEach(m=>{const t=S.mats[m.mat];m.tipo=t?t.tipo:'';
    m.pal=null;if(m.t==='ingreso'&&t&&t.cpal>1&&norm(t.umb)===norm(m.um))m.pal=m.cant/t.cpal});
}

async function syncFromSupabase(force){
  if(typeof XLSX==='undefined'||syncState==='syncing')return;
  if(!force&&S&&S.meta&&S.meta.file==='LAYOUT v3.0.xlsm'&&S.cells.length>0)return;
  syncState='syncing';
  updateStatusPill();
  try{
    const url=`${SUPABASE_EXCEL_URL}?t=${Date.now()}`;
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const d=parseWorkbook(wb,'LAYOUT v3.0.xlsm');
    if(d.mov.length||d.cells.length||Object.keys(d.mats).length){
      S=d;prepare();save();syncState='ok';lastSyncAt=Date.now();render();
    }else{
      syncState='error';updateStatusPill();
    }
  }catch(err){
    console.warn('No se pudo sincronizar desde Supabase:',err);
    syncState='error';updateStatusPill();
  }
}

function loadFile(f){
  if(!f)return;
  if(typeof XLSX==='undefined'){showErr('No se pudo cargar la librería de lectura de Excel (revisa tu conexión a internet) y vuelve a intentar.');return}
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const d=parseWorkbook(wb,f.name);
      if(!d.mov.length&&!d.cells.length){showErr('No encontré las hojas esperadas en «'+esc(f.name)+'». Se esperan: INGRESO DE MERCADERÍA, CONSUMO DE ALMACÉN, TRASPASO 004, LAYOUT v2, MAESTRO y Verificación.');return}
      S=d;prepare();save();syncState='ok';lastSyncAt=Date.now();UI.f={from:'',to:'',q:'',user:'',um:''};UI.map.q='';UI.map.cats=new Set();UI.sel='';UI.limit=150;render();
    }catch(err){showErr('No pude leer el archivo: '+esc(err.message))}
  };
  rd.readAsArrayBuffer(f);
}
function showErr(m){const b=$('#errbox');if(b){b.innerHTML=m;b.hidden=false}else{alert(m)}}

function updateStatusPill(){
  const st=$('#status');if(!st)return;
  if(syncState==='syncing'){
    st.className='pill-st sync';
    st.innerHTML='<i></i>Sincronizando LAYOUT v3.0.xlsm desde nube…';
    return;
  }
  if(syncState==='error'&&S){
    st.className='pill-st ok';
    st.innerHTML=`<i></i>Caché local · ${esc(S.meta.file)} · ${esc(new Date(S.meta.at).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}))}`;
    return;
  }
  st.className='pill-st'+(S?' ok':'');
  st.innerHTML=S
    ? `<i></i>Datos actualizados · ${esc(S.meta.file)} · ${esc(new Date(S.meta.at).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}))}`
    : '<i></i>Sin datos cargados';
}

function render(){
  if(!S&&UI.view!=='resumen')UI.view='resumen';
  document.querySelectorAll('#side button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.view===UI.view);b.disabled=!S&&b.dataset.view!=='resumen'});
  updateStatusPill();
  $('#sidefoot').innerHTML=`<button class="btn ghost sm" id="btnsync">Actualizar desde nube</button>`+(S?`<button class="btn ghost sm" id="btnload">Cargar otro Excel</button><button class="btn ghost sm" id="btnclear">Borrar datos</button>`:`<button class="btn ghost sm" id="btnload">Cargar Excel local</button>`);
  const m=$('#main');
  if(!S){m.innerHTML=dropHTML();return}
  if(UI.view==='resumen')m.innerHTML=resumenHTML();
  else if(UI.view==='mapa')m.innerHTML=mapaHTML();
  else if(UI.view==='stock')m.innerHTML=stockPageHTML();
  else if(UI.view==='libres')m.innerHTML=libresPageHTML();
  else if(UI.view==='analisis')m.innerHTML=analisisPageHTML();
  else m.innerHTML=movHTML();
  if(UI.view==='mapa')bindMapa();
  if(UI.view==='movimientos')bindMov();
  if(UI.view==='stock')bindStock();
  if(UI.view==='libres'&&$('#lpas'))bindLibres();
  if(UI.view==='analisis'&&$('#afrom'))bindAnalisis();
  if(location.hash!=='#'+UI.view){try{history.replaceState(null,'','#'+UI.view)}catch(e){}}
}

function catInfo(k){return CAT_BY_KEY[k]||{n:k.replace(/^otro:/,''),c:'#9aa5a1'}}

function mini(type,label,cv){
  const days=S.dates;if(!days.length)return `<div class="empty">Sin fechas de movimiento registradas.</div>`;
  const cnt={};S.mov.forEach(m=>{if(m.t===type&&m.fecha)cnt[m.fecha]=(cnt[m.fecha]||0)+1});
  const vals=days.map(d=>cnt[d]||0);const mx=Math.max(1,...vals);
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p};
  const top=nice(mx);const W=640,H=96,L=34,B=18,T=6,R=4;const iw=W-L-R,ih=H-T-B;
  const gw=iw/days.length;const bw=Math.max(3,Math.min(18,gw*.62));
  let g='';[0,top/2,top].forEach(v=>{const y=T+ih-ih*v/top;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end">${nf.format(v)}</text>`});
  days.forEach((d,i)=>{const v=vals[i];const x=L+gw*i+(gw-bw)/2;const hh=ih*v/top;
    g+=`<rect x="${x}" y="${T+ih-hh}" width="${bw}" height="${hh}" rx="2" fill="var(${cv})" data-tip="${fmtDate(d)}\n${label}: ${nf.format(v)} líneas"/>`;
    if(days.length<=20||i%Math.ceil(days.length/12)===0)g+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${fmtShort(d)}</text>`;
    g+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-tip="${fmtDate(d)}\n${label}: ${nf.format(v)} líneas"/>`});
  const tot=vals.reduce((a,b)=>a+b,0);
  return `<div class="mini"><div class="t"><b><span class="sw" style="background:var(${cv})"></span>${label}</b><span class="note mono">${nf.format(tot)} en total</span></div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} por día">${g}</svg></div>`;
}

function matchSet(){
  const q=UI.map.q.trim();if(!q)return null;

  Object.keys(S.maestro).forEach(loc=>{
    if(S.maestro[loc].some(x=>{const nm=(S.mats[x.mat]||{}).nom||'';
      return x.mat===q.trim()||norm(nm).includes(qn)||norm(x.lote)===qn}))set.add(loc)});
  return set;

      clean.forEach(s=>{

        ws['!cols']=Object.keys(s.rows[0]).map(k=>({wch:Math.min(42,Math.max(k.length+2,...s.rows.slice(0,200).map(r=>String(r[k]==null?'':r[k]).length+2)))}));
        XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31));
      });
      XLSX.writeFile(wb,stampName(base)+'.xlsx');return;
    }catch(e){console.warn('No se pudo generar el Excel; se descarga CSV',e)}
  }
  const s=clean[0];const cols=Object.keys(s.rows[0]);const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+[cols.map(q).join(',')].concat(s.rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),stampName(base)+'.csv');
}

function stockByMat(){
  const g={};
  Object.keys(S.maestro).forEach(loc=>S.maestro[loc].forEach(x=>{
    const o=g[x.mat]||(g[x.mat]={mat:x.mat,locs:new Set(),lotes:new Set(),q:0,lines:[],minD:null,venc:''});
    o.locs.add(loc);if(x.lote)o.lotes.add(x.lote);o.q+=x.cant||0;o.lines.push({loc,...x});
    if(x.venc){const d=daysTo(x.venc);if(o.minD==null||d<o.minD){o.minD=d;o.venc=x.venc}}
  }));
  return Object.values(g);
}

function libresData(){
  const all=libresRows();const pas=[...new Set(all.map(r=>r.pas))].sort();
  const by={};pas.forEach(p=>by[p]={t:0,l:0,lv:[0,0,0,0,0,0]});
  all.forEach(r=>{const o=by[r.pas];o.t++;if(r.libre){o.l++;if(r.lv>=1&&r.lv<=5)o.lv[r.lv]++}});
  const f=UI.lib;
  const list=all.filter(r=>r.libre&&(!f.aisle||r.pas===f.aisle)&&(!f.lv||r.lv===+f.lv)&&(!f.kind||r.cat===f.kind))
    .sort((a,b)=>a.pas.localeCompare(b.pas)||a.col-b.col||a.lv-b.lv);
  /* Conflictos: el plano la marca libre, pero MAESTRO le asigna material (no depende de los filtros) */
  const conf=all.filter(r=>r.libre&&S.maestro[r.code]).sort((a,b)=>a.pas.localeCompare(b.pas)||a.col-b.col||a.lv-b.lv);
  return {all,pas,by,list,conf};
}

}

/* ---------- ANÁLISIS DE MOVIMIENTOS ---------- */
function analisisData(){
  const a=UI.a;
  const rows=S.mov.filter(m=>(!a.from||m.fecha>=a.from)&&(!a.to||m.fecha<=a.to));
  const t={ingreso:0,consumo:0,traspaso:0};rows.forEach(m=>t[m.t]++);
  const days=new Set(rows.map(m=>m.fecha).filter(Boolean));
  const mm={};rows.forEach(m=>{if(!m.fecha)return;const k=m.fecha.slice(0,7);(mm[k]||(mm[k]={ingreso:0,consumo:0,traspaso:0}))[m.t]++});
  let keys=Object.keys(mm).sort();
  if(keys.length){const out=[];let [y,mo]=keys[0].split('-').map(Number);const [y2,m2]=keys[keys.length-1].split('-').map(Number);
    while(y<y2||(y===y2&&mo<=m2)){const k=y+'-'+String(mo).padStart(2,'0');out.push(k);if(!mm[k])mm[k]={ingreso:0,consumo:0,traspaso:0};mo++;if(mo>12){mo=1;y++}}
    keys=out}
  const g={};rows.filter(m=>m.t===a.tipo).forEach(m=>{const k=m.mat+'|'+m.um;
    const o=g[k]||(g[k]={mat:m.mat,um:m.um,desc:m.desc||matNom(m.mat),n:0,q:0,last:'',days:new Set()});
    o.n++;o.q+=Math.abs(m.cant);if(m.fecha){o.days.add(m.fecha);if(m.fecha>o.last)o.last=m.fecha}});
  const top=Object.values(g).sort((x,y)=>y.n-x.n||y.q-x.q);
  const us={};rows.forEach(m=>{const u=m.user||'(sin usuario)';const o=us[u]||(us[u]={user:u,ingreso:0,consumo:0,traspaso:0,n:0});o[m.t]++;o.n++});
  const users=Object.values(us).sort((x,y)=>y.n-x.n);
  let sinCons=[];
  if(S.hasInv){
    const consMats=new Set(rows.filter(m=>m.t==='consumo').map(m=>m.mat));
    const lastC={};S.mov.forEach(m=>{if(m.t==='consumo'&&m.fecha&&(!lastC[m.mat]||m.fecha>lastC[m.mat]))lastC[m.mat]=m.fecha});
    sinCons=stockByMat().filter(o=>!consMats.has(o.mat)).sort((x,y)=>y.locs.size-x.locs.size||y.q-x.q).map(o=>({...o,last:lastC[o.mat]||''}));
  }
  return {rows,t,days,keys,mm,top,users,sinCons};
}
function monthlyChart(d){
  if(!d.keys.length)return vacio('Sin fechas de movimiento en el período.');
  const W=1100,H=250,L=44,B=28,T=8,R=6,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(1,...d.keys.map(k=>Math.max(d.mm[k].ingreso,d.mm[k].consumo,d.mm[k].traspaso)));const top=niceMax(mx);
  const gw=iw/d.keys.length;const bw=Math.max(3,Math.min(28,gw*.26));
  const ser=[['ingreso','Ingresos','--s-ingreso'],['consumo','Consumos','--s-consumo'],['traspaso','Traspasos','--s-traspaso']];
  let g='';[0,top/2,top].forEach(v=>{const y=T+ih-ih*v/top;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end">${nf.format(v)}</text>`});
  d.keys.forEach((k,i)=>{
    const x0=L+gw*i+(gw-bw*3-4)/2;
    ser.forEach((s,j)=>{const v=d.mm[k][s[0]];const hh=ih*v/top;
      g+=`<rect x="${x0+j*(bw+2)}" y="${T+ih-hh}" width="${bw}" height="${hh}" rx="2" fill="var(${s[2]})" data-tip="${monthLabel(k)}\n${s[1]}: ${nf.format(v)} líneas"/>`});

  });

  try{navigator.clipboard.writeText(tsv).then(()=>done(true),()=>fallbackCopy(tsv,done))}catch(e){fallbackCopy(tsv,done)}
}
